<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разбей Яйцо!</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* Стиль для вашей картинки яйца (без анимаций) */
        img { width: 250px; height: auto; margin: 20px 0; display: inline-block; }
        
        input, button { padding: 12px; margin: 5px; border-radius: 8px; border: none; font-size: 16px; }
        input { background: #333; color: #fff; width: 80%; max-width: 300px; text-align: center; }
        button { background: #ff9800; color: #fff; font-weight: bold; cursor: pointer; width: 85%; max-width: 320px; }
        button:disabled { background: #555; cursor: not-allowed; }
        #chat { max-height: 300px; overflow-y: auto; background: #111; padding: 10px; border-radius: 8px; text-align: left; margin-top: 20px; display: flex; flex-direction: column-reverse; }
        .msg { padding: 8px; border-bottom: 1px solid #222; font-size: 14px; }
        .win-msg { color: #4caf50; font-weight: bold; background: rgba(76,175,80,0.1); border-radius: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #222; padding: 30px; border-radius: 15px; max-width: 400px; border: 2px solid #ff9800; }
    </style>
</head>
<body>

<div class="container">
    <h2>🥚 Ивент: Разбей Яйцо!</h2>
    <p>Каждый удар стоит 100 очков. Шанс разбить: 0.5%</p>
    
    <!-- Картинка вашего яйца с ПК -->
    <img id="egg" src="egg.png" alt="Яйцо">
    
    <div id="setup-fields">
        <input type="text" id="username" placeholder="Введите ваше Имя / Никнейм"><br>
        <input type="number" id="userpoints" placeholder="Сколько у вас очков?"><br>
    </div>
    
    <input type="text" id="comment" placeholder="Напишите комментарий (например: Бью!)" style="display:none;"><br>
    <button id="hit-btn" onclick="makeHit()">Ударить по яйцу!</button>

    <h3>Лента комментариев:</h3>
    <div id="chat"></div>
</div>

<!-- Модальное окно окончания игры -->
<div id="gameover-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title" style="color: #ff9800;">Игра окончена!</h2>
        <p id="modal-text">Победитель уже разбил яйцо. Ивент завершен.</p>
    </div>
</div>

<script>
    // Ваша ссылка из Firebase:
    const DB_URL = "https://firebaseio.com"; 

    let isGameOver = false;

    function initLiveSync() {
        setInterval(() => {
            fetch(DB_URL + "gameState.json").then(r => r.json()).then(state => {
                if (state && state.winnerFound && !isGameOver) {
                    isGameOver = true;
                    document.getElementById('hit-btn').disabled = true;
                    showModal("Игра окончена!", `Победитель найден! Игрок <b>${state.winnerName}</b> разбил яйцо! Ивент завершен.`);
                }
            });
        }, 2000);

        setInterval(() => {
            fetch(DB_URL + "comments.json?orderBy=\"\$key\"&limitToLast=20").then(r => r.json()).then(data => {
                if(!data) return;
                const chat = document.getElementById('chat');
                chat.innerHTML = "";
                Object.keys(data).sort().reverse().forEach(key => {
                    const c = data[key];
                    const div = document.createElement('div');
                    div.className = "msg" + (c.result === "выиграл" ? " win-msg" : "");
                    div.innerHTML = `<b>${c.name}</b>: ${c.text} — <i>${c.result === "выиграл" ? "ВЫИГРАЛ! 🎉" : "Не разбилось 🥚 (Остаток: " + c.rem + ")"}</i>`;
                    chat.appendChild(div);
                });
            });
        }, 2500);
    }

    function makeHit() {
        if (isGameOver) return;

        const name = document.getElementById('username').value.trim();
        let points = parseInt(document.getElementById('userpoints').value);
        const commText = document.getElementById('comment').value.trim() || "Бью!";

        if (!name || isNaN(points)) {
            alert("Пожалуйста, введите свое имя и количество очков!");
            return;
        }

        if (points < 100) {
            alert("У вас недостаточно очков для удара (нужно минимум 100)!");
            return;
        }

        document.getElementById('setup-fields').style.display = "none";
        document.getElementById('comment').style.display = "inline-block";

        points -= 100;
        document.getElementById('userpoints').value = points;

        // ШАНС КАЗИНО: 0.5%
        const roll = Math.random();
        let finalResult = "проиграл";

        if (roll <= 0.005) {
            finalResult = "выиграл";
        }

        const newComment = { name: name, text: commText, result: finalResult, rem: points };
        fetch(DB_URL + "comments.json", { method: "POST", body: JSON.stringify(newComment) });

        if (finalResult === "выиграл") {
            fetch(DB_URL + "gameState.json", { method: "PUT", body: JSON.stringify({ winnerFound: true, winnerName: name }) });
            showModal("🎉 ВЫ ПОБЕДИТЕЛЬ!", "Вы разбили яйцо! Сделайте скриншот этого экрана и скорее перейдите в нашу группу ВК для получения приза!");
        }
    }

    function showModal(title, text) {
        document.getElementById('modal-title').innerHTML = title;
        document.getElementById('modal-text').innerHTML = text;
        document.getElementById('gameover-modal').style.display = "flex";
    }

    window.onload = initLiveSync;
</script>
</body>
</html>
